<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD Bot Pairing</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
  input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; font-size: 15px; box-sizing: border-box; }
  input { background: #333; color: #fff; }
  button { background: #25D366; color: #000; font-weight: bold; cursor: pointer; }
  button:hover { background: #1ebe57; }
  #result { margin-top: 15px; font-size: 15px; word-break: break-all; }
  .code { font-size: 24px; font-weight: bold; color: #25D366; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="box">
    <h2>WhatsApp Pairing</h2>
    <input type="text" id="phone" placeholder="923001234567" />
    <button onclick="getPair()">Get Pairing Code</button>
    <div id="result"></div>
  </div>

  <script>
    const API_URL = ''; 

    async function getPair() {
      const phone = document.getElementById('phone').value.trim();
      const result = document.getElementById('result');
      result.innerHTML = 'Loading...';
      try {
        const res = await fetch(`${API_URL}/pair`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumber: phone })
        });
        const data = await res.json();
        if (data.pairingCode) {
          result.innerHTML = `<p>Pairing Code:</p><p class="code">${data.pairingCode}</p><p>${data.message}</p>`;
        } else {
          result.innerHTML = `<p>${data.error || data.message}</p>`;
        }
      } catch (e) {
        result.innerHTML = `<p>Error: ${e.message}</p>`;
      }
    }
  </script>
</body>
</html>
