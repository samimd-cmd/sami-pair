<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMI-MD - Pair Code</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#161616;padding:30px;border-radius:20px;text-align:center;width:320px;box-shadow:0 0 20px #00ff88}
h1{color:#00ff88;margin:0}
input{width:90%;padding:12px;margin:15px 0;border-radius:10px;border:none;outline:none;text-align:center;font-size:16px}
button{width:95%;padding:12px;background:#00ff88;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}
#code{margin-top:20px;font-size:22px;letter-spacing:3px;font-weight:bold;color:#00ff88}
</style>
</head>
<body>
<div class="card">
<h1>SAMI-MD</h1>
<p>Enter Your WhatsApp Number</p>
<input id="number" placeholder="9230xxxxxxxx">
<button onclick="pair()">GET PAIR CODE</button>
<div id="code"></div>
<p style="font-size:12px;margin-top:20px;opacity:0.6">© SAMI-MD Official Pair Site</p>
</div>
<script>
function pair(){
let num=document.getElementById('number').value;
if(num.length<10){alert('Number sahi likho!');return;}
let c="SAMI-"+Math.random().toString(36).substring(2,6).toUpperCase()+"-"+num.slice(-4);
document.getElementById('code').innerText=c;
}
</script>
</body>
</html>
